<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediTrack FINAL — Hospital Patient Data Analysis System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f6f9;--surface:#fff;--ink:#1b2430;--muted:#5b6b7c;--line:#e2e7ee;--brand:#0e6e5c;--brand-dark:#0a5346;--accent:#2f6fed;--warn:#c0392b;--gold:#b8860b;--radius:14px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1b2129;--ink:#eef2f6;--muted:#9aa7b4;--line:#2a323c;}}
:root[data-theme="dark"]{--bg:#12161b;--surface:#1b2129;--ink:#eef2f6;--muted:#9aa7b4;--line:#2a323c;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%}
h1,h2,h3{margin:0 0 6px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
label{font-size:12.5px;color:var(--muted);display:block;margin:8px 0 3px}
.live-clock{font-size:12px;opacity:.95;white-space:nowrap}
.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-size:12px}
.btn{border:none;border-radius:9px;padding:9px 14px;font-weight:600;transition:.15s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-danger{background:var(--warn);color:#fff}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.wrap{max-width:1120px;margin:0 auto;padding:18px}
.center-wrap{max-width:420px;margin:40px auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:680px){.grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .num{font-size:22px;font-weight:700;color:var(--brand)}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:2px}
.role-card{border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;background:var(--surface);transition:.15s}
.role-card:hover{border-color:var(--brand);transform:translateY(-2px)}
.role-card .emoji{font-size:34px}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:9px 14px;border:none;background:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:var(--brand);border-color:var(--brand)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.subtab{padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600}
.subtab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase}
.tablewrap{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag.ok{background:#e4f6ee;color:#0e6e5c}
.tag.warn{background:#fdeeee;color:#c0392b}
.tag.info{background:#eaf1ff;color:#2f6fed}
.tag.pend{background:#fff4e0;color:#b8860b}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--warn);font-size:13px;margin-top:6px}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.timeline .item{margin-bottom:14px;position:relative}
.timeline .item:before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.hidden{display:none!important}
.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.searchrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.searchrow input,.searchrow select{width:auto;flex:1;min-width:120px}
canvas{max-height:250px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;border-left:4px solid}
.alert.high{background:#fdeeee;border-color:var(--warn)}
.alert.attn{background:#fff4e0;border-color:var(--gold)}
.alert.info{background:#eaf1ff;border-color:var(--accent)}
.bar{background:var(--line);border-radius:8px;height:14px;overflow:hidden}
.bar>div{height:100%;background:var(--brand)}
.notif{padding:10px;border-radius:9px;border:1px solid var(--line);margin-bottom:8px;font-size:13.5px}
.notif.unread{border-left:3px solid var(--brand);background:rgba(14,110,92,.05)}
.security-card{border:1px solid var(--line);border-left:4px solid var(--brand);background:var(--surface);border-radius:12px;padding:14px;margin:12px 0}
.otp-box{font-size:24px;letter-spacing:7px;text-align:center;font-weight:800;padding:14px;border:1px dashed var(--brand);border-radius:10px;margin:12px 0}
.admin-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;background:#eaf1ff;color:#2f6fed;font-size:12px;font-weight:700}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;white-space:pre-wrap;font-family:monospace;padding:20px}}
#printArea{display:none}
</style>
</head>

function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function deptFor(name){return DEPARTMENTS[hashStr(name)%DEPARTMENTS.length];}
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function monthOf(d){return d?d.slice(0,7):'—';}

let state=loadState()||seedState();

function normalizeState(){
  state.patients=Array.isArray(state.patients)?state.patients:[];
  state.doctors=Array.isArray(state.doctors)?state.doctors:[];
  state.appointments=Array.isArray(state.appointments)?state.appointments:[];
  state.activity=Array.isArray(state.activity)?state.activity:[];
  state.notifications=Array.isArray(state.notifications)?state.notifications:[];
  state.receptionists=Array.isArray(state.receptionists)?state.receptionists:[];
  state.rooms=Array.isArray(state.rooms)?state.rooms:[];

  state.doctors.forEach((d,i)=>{
    d.doctorId=d.doctorId||('D'+(501+i));
    d.department=d.department||deptFor(d.name||'Doctor');
    if(!d.availability)d.availability=(hashStr(d.name||'Doctor')%10<8?'Available':'Unavailable');
    d.workingHours=Array.isArray(d.workingHours)&&d.workingHours.length ? d.workingHours : [{start:'09:00',end:'14:00'},{start:'16:00',end:'20:00'}];
  });
  // Repair the default demo account when an older browser copy has stale credentials.
  if(!state.receptionists.length)state.receptionists=[{...RECEPTION_PROFILE}];
  let demoReception=state.receptionists.find(r=>String(r.receptionId)===RECEPTION_PROFILE.receptionId);
  if(!demoReception){demoReception={...RECEPTION_PROFILE};state.receptionists.push(demoReception);}
  else Object.assign(demoReception,RECEPTION_PROFILE);
  if(!state.rooms.length)state.rooms=Array.from({length:40},(_,i)=>({roomNumber:101+i,bedNumber:'B1',status:'Available',patientId:null,department:null}));
  state.rooms.forEach(r=>{r.status=r.status||'Available';r.bedNumber=r.bedNumber||'B1';r.patientId=r.patientId||null;});
  const activeRoomIds=new Set();
  state.patients.forEach(p=>{
    if(!p.room)return;
    const room=state.rooms.find(r=>String(r.roomNumber)===String(p.room));
    if(!room)return;
    if(p.registrationStatus==='Admitted' && p.paymentStatus==='Paid'){room.status='Occupied';room.patientId=p.patientId;room.department=p.department||null;activeRoomIds.add(String(room.roomNumber));}
    else if(['Awaiting Payment','Payment Completed - Awaiting Bed Assignment','Bed Requested'].includes(p.registrationStatus)){room.status='Reserved';room.patientId=p.patientId;room.department=p.department||null;activeRoomIds.add(String(room.roomNumber));}
  });
  state.rooms.forEach(r=>{if(!activeRoomIds.has(String(r.roomNumber)) && r.status!=='Occupied'){r.status='Available';r.patientId=null;}});
  // New patient workflow fields. Legacy dataset patients remain historical/admitted records.
  state.patients.forEach(p=>{
    if(p.registrationStatus===undefined){
      p.registrationStatus='Admitted';
      p.paymentStatus=p.billing?'Paid':'Not Generated';
      p.severity=p.severity||'Moderate';
      p.bed=p.bed||null;
      p.receipt=p.receipt||null;
    }
  });
  if(state.systemVersion<5){
    // Freshen the demo scheduling state so stale localStorage cannot make every doctor
    // appear available/unavailable incorrectly. Doctors start Available and their slots
    // are then constrained by working hours and existing appointments.
    state.doctors.forEach(d=>{d.availability='Available';d.workingHours=[{start:'09:00',end:'14:00'},{start:'16:00',end:'20:00'}];});
    // Only patients created through the reception billing workflow receive daily bed charges.
    // Historical DATASET records are kept as historical records and are not charged retroactively.
    state.patients.forEach(p=>{
      if(p.billingReceipt && p.registrationStatus==='Admitted'){
        p.bedRate=bedRateForSeverity(p.severity||'Mild');
        p.baseBill=Number(p.baseBill??p.billing??0);
        p.admission=p.admission||todayStr();
      }
    });
    state.systemVersion=5;
  }

  if(state.systemVersion<6){
    // v6 billing/payment migration: enforce the current bed tariff and UPI payment destination.
    state.patients.forEach(p=>{
      if(p.registrationStatus==='Admitted'){
        p.bedRate=bedRateForSeverity(p.severity||'Mild');
        p.baseBill=Number(p.baseBill??p.billing??0);
        p.billing=currentBillAmount(p);
      }
      p.paymentUpiId=p.paymentUpiId||'9381629089@ptyes';
      p.paymentReference=p.paymentReference||'';
    });
    state.systemVersion=6;
  }

  if(state.systemVersion<7){
    // v7 migration: existing patients created through the live reception workflow
    // must use the current severity tariff instead of the old department-based tariff.
    state.patients.forEach(p=>{
      p.paymentUpiId=p.paymentUpiId||'9381629089@ptyes';
      p.paymentReference=p.paymentReference||'';
      if(p.billingReceipt){
        const tariff=calculateBill(p.department||'',p.severity||'Mild');
        if(p.registrationStatus==='Admitted'){
          // Keep an already-recorded payment amount/history intact; only normalize the
          // base tariff for the current demo workflow when it has not been paid yet.
          if(p.paymentStatus!=='Paid'){
            p.baseBill=tariff;
            p.billing=currentBillAmount(p);
          }
          p.bedRate=bedRateForSeverity(p.severity||'Mild');
        }else if(['Awaiting Payment','Payment Completed - Awaiting Bed Assignment','Bed Requested'].includes(p.registrationStatus)){
          p.baseBill=tariff;
          p.billing=tariff;
          if(p.paymentStatus!=='Paid')p.amountPaid=0;
        }
      }
    });
    state.systemVersion=7;
  }

  if(state.systemVersion<8){
    // v8 migration: force the current severity tariff onto every live workflow
    // patient so browsers that already ran v7 cannot retain the old ₹5,000+ demo tariff.
    state.patients.forEach(p=>{
      p.paymentUpiId=p.paymentUpiId||'9381629089@ptyes';
      p.paymentReference=p.paymentReference||'';
      if(!p.billingReceipt)return;
      const liveStatuses=['Registered - Awaiting Reception','Awaiting Payment','Payment Completed - Awaiting Bed Assignment','Bed Requested','Admitted'];
      if(!liveStatuses.includes(p.registrationStatus))return;
      const tariff=calculateBill(p.department||'',p.severity||'Mild');
      if(p.registrationStatus==='Admitted'){
        p.bedRate=bedRateForSeverity(p.severity||'Mild');
        p.baseBill=tariff;
        p.billing=currentBillAmount(p);
        const paid=Number(p.amountPaid||0);
        p.paymentStatus=paid>=Number(p.billing) ? 'Paid' : 'Due';
      }else{
        p.baseBill=tariff;
        p.billing=tariff;
        if(p.paymentStatus!=='Paid')p.amountPaid=0;
      }
    });
    state.systemVersion=8;
    save();
  }

  // Keep the primary administrator and any administrators explicitly authorized by an existing admin.
  const existingAdmins=Array.isArray(state.admins)?state.admins:[];
  const primaryExisting=existingAdmins.find(x=>x.adminId===ADMIN_PROFILE.adminId)||existingAdmins[0];
  // Reset the primary demo admin to the published prototype credentials.
  // Authorized secondary admins retain their own passwords.
  const adminPassword='admin123';
  const authorizedAdmins=existingAdmins.filter(x=>x&&x.adminId&&x.adminId!==ADMIN_PROFILE.adminId);
  state.admins=[{
    adminId:ADMIN_PROFILE.adminId,
    name:ADMIN_PROFILE.name,
    mobile:ADMIN_PROFILE.mobile,
    email:primaryExisting?.email||'admin@meditrack.local',
    password:adminPassword,
    signupDate:primaryExisting?.signupDate||null,
    securityLevel:'2FA',
    role:'Primary Administrator',
    grantedBy:null
  },...authorizedAdmins.map(x=>({...x,securityLevel:'2FA',role:x.role||'Authorized Administrator'}))];
  state.admins.forEach((a,i)=>{a.role=a.role||(i===0?'Primary Administrator':'Authorized Administrator');a.securityLevel='2FA';});
  state.adminSequence=Math.max(9381,...state.admins.map(a=>parseInt(String(a.adminId).replace(/\D/g,''),10)||0));
}

function computeDistributions(){
  const conds={},blood={},gender={},testRes={},dept={},ageBuckets={'0-18':0,'19-30':0,'31-45':0,'46-60':0,'60+':0},admMonth={};
  state.patients.forEach(p=>{
    conds[p.condition]=(conds[p.condition]||0)+1;
    blood[p.bloodGroup]=(blood[p.bloodGroup]||0)+1;
    gender[p.gender]=(gender[p.gender]||0)+1;
    testRes[p.testResult]=(testRes[p.testResult]||0)+1;
    dept[p.department]=(dept[p.department]||0)+1;
    const a=p.age||0; const k=a<=18?'0-18':a<=30?'19-30':a<=45?'31-45':a<=60?'46-60':'60+'; ageBuckets[k]++;
    const m=monthOf(p.admission); admMonth[m]=(admMonth[m]||0)+1;
  });
  return {conds,blood,gender,testRes,dept,ageBuckets,admMonth};
}
function medicalTimeline(p){
  const items=[];
  if(p.admission)items.push({date:p.admission,type:'Admission',text:`Admitted — Room ${p.room||'—'}`});
  (p.diagnosisHistory||[]).forEach(d=>items.push({date:d.date,type:'Diagnosis',text:`${d.diagnosis} (Dr. ${d.doctor})`}));
  (p.vitals||[]).forEach(v=>items.push({date:v.date,type:'Vitals',text:`BP ${v.bp} · HR ${v.hr} bpm · Temp ${v.temp}°F · Sugar ${v.sugar} mg/dL`}));
  (p.prescriptions||[]).forEach(pr=>items.push({date:pr.date,type:'Prescription',text:pr.medicines.map(m=>`${m.name} ${m.dosage} (${m.duration})`).join(', ')}));
  (p.labReports||[]).forEach(l=>items.push({date:l.date,type:'Lab Report',text:`${l.test}: ${l.result}`}));
  if(p.discharge)items.push({date:p.discharge,type:'Discharge',text:`Discharged — result ${p.testResult}`});
  return items.filter(i=>i.date).sort((a,b)=>a.date.localeCompare(b.date));
}

// ---------- doctor availability & slot booking ----------
function timeToMinutes(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
function minutesTo24(m){const h=Math.floor(m/60).toString().padStart(2,'0');const mm=(m%60).toString().padStart(2,'0');return `${h}:${mm}`;}
function displayTime(t){const [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';let hh=h%12;if(hh===0)hh=12;return `${hh}:${m.toString().padStart(2,'0')} ${ap}`;}
function generateSlots(doctor){
  const slots=[];
  (doctor.workingHours||[]).forEach(shift=>{
    if(!shift||!shift.start||!shift.end)return;
    let s=timeToMinutes(shift.start),e=timeToMinutes(shift.end);
    for(let m=s;m<e;m+=30)slots.push(minutesTo24(m));
  });
  return slots;
}
function bookedSlotsFor(doctorName,date){return new Set(state.appointments.filter(a=>a.doctorName===doctorName&&a.date===date&&a.status!=='Cancelled').map(a=>a.time));}
function availableSlotsForDoctorDate(doctor,date){
  if(!doctor)return [];
  if(doctor.availability==='On Leave'||doctor.availability==='Unavailable')return [];
  const slots=generateSlots(doctor);const booked=bookedSlotsFor(doctor.name,date);
  let free=slots.filter(s=>!booked.has(s));
  if(date===todayStr()){
    const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
    free=free.filter(s=>timeToMinutes(s)>nowMin);
  }
  return free;
}
function firstBookableDate(){
  const candidates=[todayStr()];
  const d=new Date();d.setDate(d.getDate()+1);candidates.push(d.toISOString().slice(0,10));
  for(const date of candidates){
    if(state.doctors.some(dd=>availableSlotsForDoctorDate(dd,date).length))return date;
  }
  return todayStr();
}
function doctorStatusForDate(doctor,date){
  if(doctor.availability==='On Leave')return {status:'unavailable',label:'🔴 On Leave'};
  if(doctor.availability==='Unavailable')return {status:'unavailable',label:'🔴 Unavailable'};
  const total=generateSlots(doctor).length;
  if(total===0)return {status:'unavailable',label:'🔴 No hours set'};
  const free=availableSlotsForDoctorDate(doctor,date).length;
  if(free===0)return {status:'unavailable',label:'🔴 Fully booked'};
  if(free/total<=0.3)return {status:'busy',label:'🟡 Busy'};
  return {status:'available',label:'🟢 Available'};
}
function nextAvailableAcrossDays(doctor,fromDate){
  let d=new Date(fromDate+'T00:00:00');
  for(let i=0;i<8;i++){
    const dateStr=d.toISOString().slice(0,10);
    const free=availableSlotsForDoctorDate(doctor,dateStr);
    if(free.length)return {date:dateStr,time:free[0]};
    d.setDate(d.getDate()+1);
  }
  return null;
}

  let html=`<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">

  return html+`</div>`;
}
function renderAlternatives(doc){
  const nextA=nextAvailableAcrossDays(doc,bookDate);
  const alts=state.doctors.filter(dd=>dd.department===doc.department&&dd.name!==doc.name)
    .map(dd=>({dd,slot:availableSlotsForDoctorDate(dd,bookDate)[0]})).filter(x=>x.slot);

}

// ---------- RECEPTION / BILLING ----------
function calculateBill(dept,severity){
  // Hospital bill tariff requested by the project: Mild/Moderate ₹100, Severe/Critical ₹400.
  return (severity==='Severe'||severity==='Critical') ? 400 : 100;
}
function bedRateForSeverity(severity){return (severity==='Severe'||severity==='Critical')?400:100;}
function admittedBedDays(p){
  if(!p||!p.admission||!p.bedRate)return 0;
  const start=new Date(p.admission+'T00:00:00');
  if(Number.isNaN(start.getTime()))return 0;
  const now=new Date();
  const elapsed=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);
  return Math.max(1,elapsed+1);
}
function currentBillAmount(p){
  if(!p)return 0;
  const base=Number(p.baseBill??p.billing??0);
  if(!p.bedRate||p.registrationStatus!=='Admitted')return base;
  // The initial bill covers day 1. Additional daily bed charges accrue from day 2 onward.
  return base + Math.max(0,admittedBedDays(p)-1)*Number(p.bedRate);
}
function accrueBedCharges(){
  let changed=false;
  state.patients.forEach(p=>{
    if(p.registrationStatus==='Admitted'&&p.bedRate){
      const next=currentBillAmount(p);
      if(Number(p.billing)!==next){p.billing=next;changed=true;}
      const paid=Number(p.amountPaid||0);
      if(paid<next && p.paymentStatus==='Paid'){p.paymentStatus='Due';changed=true;}
    }
  });
  if(changed)save();
  return changed;
}

function doctorTreatmentStats(d){
  const assigned=state.patients.filter(p=>p.doctor===d.name);
  const treatedIds=new Set();
  assigned.forEach(p=>{
    const completed=state.appointments.some(a=>a.patientId===p.patientId&&a.doctorName===d.name&&a.status==='Completed');
    const hasClinicalWork=(p.diagnosisHistory||[]).length>0 || (p.prescriptions||[]).some(pr=>pr.doctor===d.name);
    if(completed||hasClinicalWork)treatedIds.add(p.patientId);
  });
  return {assigned:assigned.length,treated:treatedIds.size,remaining:Math.max(0,assigned.length-treatedIds.size)};
}

function fillPatientTable(){
  const tbody=document.getElementById('patientTableBody'); if(!tbody)return;
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const fd=document.getElementById('filterDept')?.value||''; const fg=document.getElementById('filterGender')?.value||''; const ft=document.getElementById('filterTest')?.value||'';
  const rows=state.patients.filter(p=>{
    const mq=!q||[p.name,p.condition,p.doctor,p.testResult].join(' ').toLowerCase().includes(q);
    return mq&&(!fd||p.doctor===fd)&&(!fg||p.gender===fg)&&(!ft||p.testResult===ft);
  });
  tbody.innerHTML=rows.map(p=>`<tr><td>${p.name}</td><td>${p.age}/${p.gender}</td><td>${p.condition}</td><td>${p.doctor}</td><td>${p.department}</td>
    <td><span class="tag ${p.testResult==='Normal'?'ok':'warn'}">${p.testResult}</span></td><td>$${(p.billing||0).toLocaleString(undefined,{maximumFractionDigits:0})}</td></tr>`).join('');
  tbody._rows=rows;
}
function fillAppointmentsTable(){
  const tbody=document.getElementById('apTableBody'); if(!tbody)return;
  const fd=document.getElementById('apDoc')?.value||''; const fs=document.getElementById('apStatus')?.value||'';
  const rows=state.appointments.filter(a=>(!fd||a.doctorName===fd)&&(!fs||a.status===fs)).sort((a,b)=>b.date.localeCompare(a.date));
  tbody.innerHTML=rows.map(a=>`<tr><td>${a.patientName}</td><td>${a.doctorName}</td><td>${a.department}</td><td>${a.date}</td><td>${a.time}</td>
    <td><span class="tag ${a.status==='Confirmed'?'ok':a.status==='Cancelled'?'warn':a.status==='Completed'?'info':'pend'}">${a.status}</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No appointments.</td></tr>';
}
let charts={};
function destroyCharts(){Object.values(charts).forEach(c=>c&&c.destroy());charts={};}
function bar(id,labels,data,color){const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{data,backgroundColor:color}]},options:{plugins:{legend:{display:false}}}});}
function line(id,labels,data,color){const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{data,borderColor:color,backgroundColor:color,tension:.3}]},options:{plugins:{legend:{display:false}}}});}
function doughnut(id,labels,data){const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;charts[id]=new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:['#0e6e5c','#2f6fed','#b8860b','#c0392b','#8e44ad','#16a085']}]}});}
function drawAdminCharts(){
  destroyCharts();
  const {conds,blood,gender,testRes,dept,ageBuckets,admMonth}=computeDistributions();
  bar('condChart',Object.keys(conds),Object.values(conds),'#0e6e5c');
  bar('bloodChart',Object.keys(blood),Object.values(blood),'#2f6fed');
  bar('ageChart',Object.keys(ageBuckets),Object.values(ageBuckets),'#b8860b');
  doughnut('genderChart',Object.keys(gender),Object.values(gender));
  const months=Object.keys(admMonth).sort();
  line('admChart',months,months.map(m=>admMonth[m]),'#0e6e5c');
  bar('deptChart',Object.keys(dept),Object.values(dept),'#8e44ad');
  doughnut('testChart',Object.keys(testRes),Object.values(testRes));
}
function drawVitalsChart(p){
  destroyCharts();
  const v=p.vitals||[]; if(!v.length)return;
  const labels=v.map((_,i)=>'Reading '+(i+1));
  const systolic=v.map(x=>+x.bp.split('/')[0]);
  line('vitalsChart',labels,systolic,'#c0392b');
}

// ---------- events ----------
function afterRender(){
  document.querySelectorAll('.role-card').forEach(el=>el.addEventListener('click',()=>{authRole=el.dataset.role;authTab='login';authErr='';admin2FA={pending:false,otp:null,expiresAt:0,maskedMobile:'',demoOtp:'',adminId:null};view='auth';render();}));
  const backBtn=document.getElementById('backBtn'); if(backBtn)backBtn.addEventListener('click',()=>{admin2FA={pending:false,otp:null,expiresAt:0,maskedMobile:'',demoOtp:'',adminId:null};view='landing';render();});
  document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{authTab=el.dataset.tab;authErr='';render();}));
  const submitBtn=document.getElementById('submitAuth'); if(submitBtn)submitBtn.addEventListener('click',handleAuthSubmit);
  const logoutBtn=document.getElementById('logoutBtn'); if(logoutBtn)logoutBtn.addEventListener('click',()=>{session=null;selectedPatientId=null;admin2FA={pending:false,otp:null,expiresAt:0,maskedMobile:'',demoOtp:'',adminId:null};view='landing';render();});
  document.querySelectorAll('.subtab').forEach(el=>el.addEventListener('click',()=>{ if(session?.role==='admin')session.lastActivity=Date.now();
    const k=el.dataset.sub; selectedPatientId=null;
    if(view==='patientHome')patientTab=k; else if(view==='doctorHome')doctorTab=k; else if(view==='adminHome')adminTab=k;
    render();
  }));
  // patient: booking
  const deptSel=document.getElementById('bk_dept');
  if(deptSel)deptSel.addEventListener('change',()=>{bookDept=deptSel.value;bookDoctor=null;render();});
  const bkDateInput=document.getElementById('bk_date');
  if(bkDateInput)bkDateInput.addEventListener('change',()=>{bookDate=bkDateInput.value;render();});
  document.querySelectorAll('[data-slots]').forEach(el=>el.addEventListener('click',()=>{bookDoctor=el.dataset.slots;render();}));
  document.querySelectorAll('[data-bookdoc]').forEach(el=>el.addEventListener('click',()=>{
    bookDept=el.dataset.bookdept; bookDoctor=el.dataset.bookdoc; bookDate=todayStr(); patientTab='appointments'; render();
  }));
  document.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===session.id);
    const [docName,time]=el.dataset.book.split('|'); const date=el.dataset.bookdate||bookDate;
    const doc=state.doctors.find(dd=>dd.name===docName);
    if(!p||!doc)return;
    const free=availableSlotsForDoctorDate(doc,date);
    if(!free.includes(time)){authErr='That slot is no longer available. Please choose another slot.';render();return;}
    const duplicate=state.appointments.some(a=>a.patientId===p.patientId&&a.doctorName===docName&&a.date===date&&a.time===time&&a.status!=='Cancelled');
    if(duplicate){alert('You already have an appointment at this time.');return;}
    const appt={id:uid('AP'),patientId:p.patientId,patientName:p.name,doctorName:docName,department:doc.department,date,time,status:'Requested'};
    state.appointments.push(appt);
    notify('doctor',doc.doctorId,`New appointment requested by ${p.name} on ${date} ${displayTime(time)}.`);
    notify('patient',p.patientId,`Appointment request sent to Dr. ${docName} for ${date} ${displayTime(time)}.`);
    logActivity(`${p.name} requested an appointment with ${docName}`);
    bookDoctor=null; save(); render();
  }));
  const docDirSearch=document.getElementById('docDirSearch');
  if(docDirSearch)docDirSearch.addEventListener('input',()=>{
    const q=docDirSearch.value.toLowerCase();
    document.querySelectorAll('#doctorDirectory [data-doc-name]').forEach(el=>{
      const match=!q||el.dataset.docName.includes(q)||el.dataset.docDept.includes(q);
      el.style.display=match?'':'none';
    });
  });
  const saveAvail=document.getElementById('saveAvail');
  if(saveAvail)saveAvail.addEventListener('click',()=>{
    const d=state.doctors.find(x=>x.doctorId===session.id);
    d.availability=document.getElementById('avail_status').value;
    const shifts=[]; const s1s=document.getElementById('shift1_start').value,s1e=document.getElementById('shift1_end').value;
    if(s1s&&s1e)shifts.push({start:s1s,end:s1e});
    const s2s=document.getElementById('shift2_start').value,s2e=document.getElementById('shift2_end').value;
    if(s2s&&s2e)shifts.push({start:s2s,end:s2e});
    d.workingHours=shifts;
    logActivity(`Dr. ${d.name} updated availability to ${d.availability}`); save(); alert('Availability updated.'); render();
  });
  const pForPayment=state.patients.find(x=>x.patientId===session.id);
  const upiPaymentPayload=pForPayment?`upi://pay?pa=9381629089%40ptyes&pn=MediTrack%20Hospital&am=${currentBillAmount(pForPayment).toFixed(2)}&cu=INR&tn=MediTrack%20Hospital%20Bill`:'';
  const upiQr=document.getElementById('upiQr');
  if(upiQr&&upiPaymentPayload){
    const qrFallback=()=>{
      const src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(upiPaymentPayload);
      upiQr.innerHTML=`<img src="${src}" width="220" height="220" alt="UPI payment QR code" style="display:block" onerror="this.parentElement.innerHTML='<div class=\"muted\" style=\"text-align:center;padding:20px\">QR image could not load.<br>Use Open UPI Payment App below.</div>'">`;
    };
    upiQr.innerHTML='';
    if(window.QRCode){
      try{new QRCode(upiQr,{text:upiPaymentPayload,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}
      catch(e){qrFallback();}
    }else{
      qrFallback();
    }
  }
  const openUpiBtn=document.getElementById('openUpiBtn');
  if(openUpiBtn)openUpiBtn.addEventListener('click',()=>{
    if(!upiPaymentPayload)return;
    window.location.href=upiPaymentPayload;
  });
  const confirmPaymentBtn=document.getElementById('confirmPaymentBtn');
  if(confirmPaymentBtn)confirmPaymentBtn.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===session.id);
    if(!p||!p.billing){alert('No bill is available for payment yet.');return;}
    if(p.paymentStatus==='Paid'){alert('This bill is already marked as Paid.');return;}
    const confirmed=confirm('Have you completed the UPI payment in your payment app?\n\nFor this demo website, tapping OK will mark the bill as Paid. Real bank/UPI verification is not connected.');
    if(!confirmed)return;
    p.amountPaid=currentBillAmount(p); p.paymentStatus='Paid'; p.paidAt=new Date().toISOString(); p.paymentReference='Payment completed'; p.paymentUpiId='9381629089@ptyes';
    p.registrationStatus='Payment Completed - Awaiting Bed Assignment';
    const paidRoom=state.rooms.find(r=>String(r.roomNumber)===String(p.room)); if(paidRoom){paidRoom.status='Reserved';paidRoom.patientId=p.patientId;paidRoom.department=p.department||null;}
    notify('reception','R1001',`Payment recorded from ${p.name}. Patient can now request a bed.`); logActivity(`${p.name} marked bill ${p.billingReceipt||''} as payment completed to 9381629089@ptyes`); save(); render();
  });
  const requestBedBtn=document.getElementById('requestBedBtn');
  if(requestBedBtn)requestBedBtn.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===session.id);
    if(!p||p.paymentStatus!=='Paid'){alert('Please complete payment before requesting a bed.');return;}
    if(!p.room){alert('Reception has not assigned a room yet.');return;}
    const room=state.rooms.find(r=>String(r.roomNumber)===String(p.room));
    if(!room){alert('Assigned room could not be found.');return;}
    room.status='Reserved';room.patientId=p.patientId;room.department=p.department||null;
    p.registrationStatus='Bed Requested';
    notify('reception','R1001',`Bed requested by ${p.name}. Room ${p.room} is reserved.`);
    logActivity(`${p.name} requested bed assignment after payment.`);save();render();
  });
  const saveProfile=document.getElementById('saveProfile');
  if(saveProfile)saveProfile.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===session.id);
    p.phone=document.getElementById('pf_phone').value; p.address=document.getElementById('pf_address').value;
    p.bloodGroup=document.getElementById('pf_blood').value; p.emergencyContact=document.getElementById('pf_emergency').value;
    save(); alert('Profile updated.'); render();
  });
  const dlBtn=document.getElementById('downloadSummary');
  if(dlBtn)dlBtn.addEventListener('click',async()=>{
    const p=state.patients.find(x=>x.patientId===session.id);
    const tl=medicalTimeline(p);
    const text=`MEDICAL SUMMARY\nPatient: ${p.name} (${p.patientId})\nAge/Gender: ${p.age}/${p.gender}  Blood group: ${p.bloodGroup}\nCondition: ${p.condition}  Doctor: ${p.doctor}\n\nHISTORY:\n`+tl.map(i=>`${i.date} [${i.type}] ${i.text}`).join('\n');
    if(downloadsApi){try{await downloadsApi.save({filename:p.patientId+'_summary.txt',data:text});return;}catch(e){}}
    document.getElementById('printArea').textContent=text; window.print();
  });
  document.querySelectorAll('[data-nid]').forEach(el=>el.addEventListener('click',()=>{
    const n=state.notifications.find(x=>x.id===el.dataset.nid); if(n){n.read=true;save();render();}
  }));
  document.querySelectorAll('[data-rec-setup]').forEach(el=>el.addEventListener('click',()=>{selectedPatientId=el.dataset.recSetup;render();}));
  const cancelRecSetup=document.getElementById('cancelRecSetup'); if(cancelRecSetup)cancelRecSetup.addEventListener('click',()=>{selectedPatientId=null;render();});
  const recDept=document.getElementById('recDept'),recSeverity=document.getElementById('recSeverity'),recDoctor=document.getElementById('recDoctor');
  function refreshReceptionDoctors(){if(!recDept||!recDoctor)return;const current=recDoctor.value;recDoctor.innerHTML=state.doctors.filter(d=>d.department===recDept.value).map(d=>`<option value="${d.doctorId}">Dr. ${d.name}</option>`).join('');if([...recDoctor.options].some(o=>o.value===current))recDoctor.value=current;}
  function refreshReceptionBill(){const box=document.getElementById('recBillPreview');if(box&&recDept&&recSeverity)box.innerHTML=`Bill amount: <b>₹${calculateBill(recDept.value,recSeverity.value).toLocaleString('en-IN')}</b>`;}
  if(recDept)recDept.addEventListener('change',()=>{refreshReceptionDoctors();refreshReceptionBill();}); if(recSeverity)recSeverity.addEventListener('change',refreshReceptionBill);
  const createBillBtn=document.getElementById('createBillBtn'); if(createBillBtn)createBillBtn.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===selectedPatientId); const roomNo=+document.getElementById('recRoom').value; const room=state.rooms.find(r=>+r.roomNumber===roomNo); const doctor=state.doctors.find(d=>d.doctorId===document.getElementById('recDoctor').value); const dept=document.getElementById('recDept').value; const severity=document.getElementById('recSeverity').value;
    if(!p||!room||room.status!=='Available'||!doctor){alert('Please select an available room and doctor.');return;}
    p.department=dept;p.severity=severity;p.doctor=doctor.name;p.room=room.roomNumber;p.bed=null;p.baseBill=calculateBill(dept,severity);p.billing=p.baseBill;p.bedRate=0;p.amountPaid=0;p.paymentStatus='Pending';p.registrationStatus='Awaiting Payment';p.billGeneratedAt=new Date().toLocaleString('en-IN');p.billingReceipt='MT-'+todayStr().replace(/-/g,'')+'-'+String(Math.floor(1000+Math.random()*9000));p.condition=p.condition==='Pending clinical assessment'?`Clinical assessment - ${severity}`:p.condition;
    room.status='Reserved';room.patientId=p.patientId;room.department=dept;
    notify('patient',p.patientId,`Bill generated: ₹${p.billing.toLocaleString('en-IN')}. Receipt ${p.billingReceipt}. Please pay from your portal before bed assignment.`); logActivity(`Reception assigned Dr. ${doctor.name} and Room ${room.roomNumber} to ${p.name}; bill ₹${p.billing}`); selectedPatientId=null;save();render();
  });
  document.querySelectorAll('[data-rec-bed]').forEach(el=>el.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===el.dataset.recBed); if(!p)return; if(p.paymentStatus!=='Paid'){alert("Bed assignment is blocked until the patient's bill is paid.");return;}
    if(!['Payment Completed - Awaiting Bed Assignment','Bed Requested'].includes(p.registrationStatus)){alert('This patient is not ready for bed assignment.');return;}
    const room=state.rooms.find(r=>String(r.roomNumber)===String(p.room) && (r.status==='Reserved'||r.patientId===p.patientId)); if(!room){alert('Assigned room is no longer reserved.');return;}
    const other=state.patients.find(x=>x.patientId!==p.patientId && x.registrationStatus==='Admitted' && String(x.room)===String(room.roomNumber)); if(other){alert('This room is already occupied.');return;}
    room.status='Occupied';room.patientId=p.patientId;room.department=p.department;p.bed=room.bedNumber||'B1';p.admission=todayStr();p.bedRate=bedRateForSeverity(p.severity);p.baseBill=Number(p.baseBill??p.billing??0);p.billing=p.baseBill;p.amountPaid=Number(p.amountPaid||0);p.registrationStatus='Admitted';
    notify('patient',p.patientId,`Bed ${p.bed} assigned in Room ${p.room}. You are now admitted.`); logActivity(`Reception assigned Bed ${p.bed}, Room ${p.room} to ${p.name} after payment.`);save();render();
  }));
  // doctor
  document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{selectedPatientId=el.dataset.view;render();}));
  const backToList=document.getElementById('backToList'); if(backToList)backToList.addEventListener('click',()=>{selectedPatientId=null;render();});
  const docSearch=document.getElementById('docSearch');
  if(docSearch)docSearch.addEventListener('input',()=>{
    const q=docSearch.value.toLowerCase();
    const res=q?state.patients.filter(p=>[p.name,p.condition,p.patientId].join(' ').toLowerCase().includes(q)):[];
    document.getElementById('searchResults').innerHTML=res.map(p=>patientCard(p)).join('');
    document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{selectedPatientId=el.dataset.view;render();}));
  });
  const addDiag=document.getElementById('addDiag');
  if(addDiag)addDiag.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===selectedPatientId); const v=document.getElementById('in_diag').value.trim(); if(!v)return;
    const d=state.doctors.find(x=>x.doctorId===session.id);
    p.diagnosisHistory=p.diagnosisHistory||[]; p.diagnosisHistory.push({date:todayStr(),doctor:d.name,diagnosis:v}); p.condition=v;
    notify('patient',p.patientId,`New diagnosis added: ${v}`); logActivity(`Dr. ${d.name} diagnosed ${p.name} with ${v}`); save(); render();
  });
  const addVitals=document.getElementById('addVitals');
  if(addVitals)addVitals.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===selectedPatientId);
    const bp=document.getElementById('in_bp').value.trim(),hr=document.getElementById('in_hr').value.trim(),temp=document.getElementById('in_temp').value.trim(),sugar=document.getElementById('in_sugar').value.trim();
    if(!bp)return; p.vitals=p.vitals||[]; p.vitals.push({date:todayStr(),bp,hr,temp,sugar});
    logActivity(`Vitals recorded for ${p.name}`); save(); render();
  });
  const addRx=document.getElementById('addRx');
  if(addRx)addRx.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===selectedPatientId); const d=state.doctors.find(x=>x.doctorId===session.id);
    const name=document.getElementById('in_med').value.trim(),dosage=document.getElementById('in_dose').value.trim()||'—',duration=document.getElementById('in_dur').value.trim()||'—';
    if(!name)return; p.prescriptions=p.prescriptions||[]; p.prescriptions.push({date:todayStr(),doctor:d.name,medicines:[{name,dosage,duration}],instructions:''});
    notify('patient',p.patientId,`New prescription added: ${name}`); logActivity(`Dr. ${d.name} prescribed ${name} to ${p.name}`); save(); render();
  });
  const addLab=document.getElementById('addLab');
  if(addLab)addLab.addEventListener('click',()=>{
    const p=state.patients.find(x=>x.patientId===selectedPatientId);
    const test=document.getElementById('in_test').value.trim(),result=document.getElementById('in_result').value;
    if(!test)return; p.labReports=p.labReports||[]; p.labReports.push({date:todayStr(),test,result}); p.testResult=result;
    notify('patient',p.patientId,`New lab result: ${test} — ${result}`); logActivity(`Lab result added for ${p.name}: ${test} (${result})`); save(); render();
  });
  document.querySelectorAll('[data-acc]').forEach(el=>el.addEventListener('click',()=>{setApptStatus(el.dataset.acc,'Confirmed');}));
  document.querySelectorAll('[data-rej]').forEach(el=>el.addEventListener('click',()=>{setApptStatus(el.dataset.rej,'Cancelled');}));
  document.querySelectorAll('[data-comp]').forEach(el=>el.addEventListener('click',()=>{setApptStatus(el.dataset.comp,'Completed');}));
  document.querySelectorAll('[data-resched]').forEach(el=>el.addEventListener('click',()=>{
    const a=state.appointments.find(x=>x.id===el.dataset.resched); if(!a)return;
    const nd=prompt('New date (YYYY-MM-DD):',a.date); if(!nd)return; const nt=prompt('New time (HH:MM):',a.time)||a.time;
    a.date=nd;a.time=nt; notify('patient',a.patientId,`Appointment rescheduled to ${nd} ${nt}.`); save(); render();
  }));
  // admin
  const grantAdminBtn=document.getElementById('grantAdminBtn');
  if(grantAdminBtn)grantAdminBtn.addEventListener('click',()=>{
    adminGrantErr='';
    const current=state.admins.find(x=>x.adminId===session?.id);
    const name=document.getElementById('newAdminName')?.value.trim();
    const mobile=document.getElementById('newAdminMobile')?.value.trim();
    const email=document.getElementById('newAdminEmail')?.value.trim();
    const pass=document.getElementById('newAdminPassword')?.value||'';
    const pass2=document.getElementById('newAdminPassword2')?.value||'';
    const currentPass=document.getElementById('grantAdminPassword')?.value||'';
    if(!current){adminGrantErr='Only a signed-in administrator can grant access.';render();return;}
    if(currentPass!==current.password){adminGrantErr='Authorization failed: current admin password is incorrect.';render();return;}
    if(!name||!/^[0-9]{10}$/.test(mobile)||!email||pass.length<8){adminGrantErr='Enter a name, valid 10-digit mobile, email, and password of at least 8 characters.';render();return;}
    if(pass!==pass2){adminGrantErr='New admin passwords do not match.';render();return;}
    if(state.admins.some(x=>(x.email||'').toLowerCase()===email.toLowerCase())){adminGrantErr='That email is already registered as an administrator.';render();return;}
    if(state.admins.some(x=>x.mobile===mobile)){adminGrantErr='That mobile number is already registered as an administrator.';render();return;}
    state.adminSequence=Math.max(9381,state.adminSequence||0)+1;
    const newId=String(state.adminSequence);
    state.admins.push({adminId:newId,name,mobile,email,password:pass,signupDate:todayStr(),securityLevel:'2FA',role:'Authorized Administrator',grantedBy:current.name});
    logActivity(`${current.name} granted administrator access to ${name} (Admin ID ${newId})`);
    notify('admin',newId,`Administrator access granted by ${current.name}. Your Admin ID is ${newId}.`);
    save();
    adminGrantErr=`Access granted successfully. New Admin ID: ${newId}`;
    render();
  });
  const searchInput=document.getElementById('searchInput'),filterDept=document.getElementById('filterDept'),filterGender=document.getElementById('filterGender'),filterTest=document.getElementById('filterTest');
  if(searchInput){fillPatientTable();[searchInput,filterDept,filterGender,filterTest].forEach(el=>el.addEventListener('input',fillPatientTable)),[filterDept,filterGender,filterTest].forEach(el=>el.addEventListener('change',fillPatientTable));}
  const resetFilters=document.getElementById('resetFilters');
  if(resetFilters)resetFilters.addEventListener('click',()=>{searchInput.value='';filterDept.value='';filterGender.value='';filterTest.value='';fillPatientTable();});
  const exportCsv=document.getElementById('exportCsv');
  if(exportCsv)exportCsv.addEventListener('click',async()=>{
    const rows=document.getElementById('patientTableBody')._rows||state.patients;
    const header='Name,Age,Gender,Condition,Doctor,Department,TestResult,Billing';
    const csv=[header,...rows.map(p=>[p.name,p.age,p.gender,p.condition,p.doctor,p.department,p.testResult,p.billing].join(','))].join('\n');
    if(downloadsApi){try{await downloadsApi.save({filename:'patients_export.csv',data:csv});return;}catch(e){}}
    alert('Download isn\'t available in this view — try again from the published page.');
  });
  const apDoc=document.getElementById('apDoc'),apStatus=document.getElementById('apStatus');
  if(apDoc){fillAppointmentsTable();apDoc.addEventListener('change',fillAppointmentsTable);apStatus.addEventListener('change',fillAppointmentsTable);}
  if(adminTab==='analytics')drawAdminCharts();
  if(view==='doctorHome'&&selectedPatientId){const p=state.patients.find(x=>x.patientId===selectedPatientId);if(p)drawVitalsChart(p);}
}
function setApptStatus(id,status){
  const a=state.appointments.find(x=>x.id===id); if(!a)return; a.status=status;
  if(status==='Confirmed')notify('patient',a.patientId,`Appointment with ${a.doctorName} confirmed for ${a.date} ${a.time}.`);
  if(status==='Cancelled')notify('patient',a.patientId,`Appointment with ${a.doctorName} was rejected.`);
  logActivity(`Appointment ${id} marked ${status}`); save(); render();
}
function maskMobile(m){return m?m.slice(0,2)+'******'+m.slice(-2):'**********';}
function createAdminOtp(admin){
  const arr=new Uint32Array(1);
  if(window.crypto?.getRandomValues)window.crypto.getRandomValues(arr);
  const otp=(100000+(arr[0]%900000)).toString();
  admin2FA={pending:true,otp,expiresAt:Date.now()+5*60*1000,maskedMobile:maskMobile(admin.mobile||''),demoOtp:otp,adminId:admin.adminId};
}
function handleAdminLogin(){
  if(Date.now()<adminLockedUntil){authErr=`Admin login is temporarily locked. Try again in ${Math.ceil((adminLockedUntil-Date.now())/1000)} seconds.`;render();return;}
  const aid=document.getElementById('f_adminId')?.value.trim();
  const pass=document.getElementById('f_pass')?.value;
  const admin=(state.admins||[]).find(x=>x.adminId===aid);
  if(!admin||pass!==admin.password){
    adminFailedAttempts++;
    if(adminFailedAttempts>=5){adminLockedUntil=Date.now()+60*1000;adminFailedAttempts=0;authErr='Too many failed attempts. Admin login locked for 60 seconds.';}
    else authErr='Invalid Admin ID or password.';
    render();return;
  }
  adminFailedAttempts=0;
  createAdminOtp(admin);
  authErr='';
  authTab='otp';
  render();
}
function verifyAdminOtp(){
  const entered=document.getElementById('f_otp')?.value.trim();
  if(!admin2FA.pending){authErr='Verification session expired. Start again.';render();return;}
  if(Date.now()>admin2FA.expiresAt){admin2FA={pending:false,otp:null,expiresAt:0,maskedMobile:'',demoOtp:'',adminId:null};authErr='OTP expired. Please sign in again.';render();return;}
  if(entered!==admin2FA.otp){authErr='Incorrect OTP.';render();return;}
  const admin=(state.admins||[]).find(x=>x.adminId===admin2FA.adminId);
  if(!admin){admin2FA={pending:false,otp:null,expiresAt:0,maskedMobile:'',demoOtp:'',adminId:null};authErr='Administrator account no longer exists.';render();return;}
  session={role:'admin',id:admin.adminId,lastActivity:Date.now()};
  admin2FA={pending:false,otp:null,expiresAt:0,maskedMobile:'',demoOtp:'',adminId:null};
  authErr=''; view='adminHome'; render();
}
function handleAuthSubmit(){
  authErr='';
  if(authRole==='admin'){
    if(authTab==='otp'){verifyAdminOtp();return;}
    handleAdminLogin();return;
  }
  const email=document.getElementById('f_email')?.value.trim();
  const pass=document.getElementById('f_pass')?.value;
  if(authRole==='reception') {
    const rid=document.getElementById('f_receptionId')?.value.trim();
    const rec=(state.receptionists||[]).find(x=>x.receptionId===rid && x.password===pass);
    if(!rec){authErr='Invalid Reception ID or password.';render();return;}
    session={role:'reception',id:rec.receptionId,lastActivity:Date.now()}; view='receptionHome'; render(); return;
  }
  if(authTab==='login'){
    let list=authRole==='patient'?state.patients:state.doctors;
    const idKey=authRole==='patient'?'patientId':'doctorId';
    const user=list.find(u=>u.email&&u.email.toLowerCase()===email?.toLowerCase()&&u.password===pass);
    if(!user){authErr='Invalid email or password.';render();return;}
    session={role:authRole,id:user[idKey],lastActivity:Date.now()}; view=authRole+'Home'; render(); return;
  }
  const name=document.getElementById('f_name')?.value.trim();
  if(!name||!email||!pass){authErr='Please fill in all required fields.';render();return;}
  if(authRole==='patient'){
    if(state.patients.some(p=>p.email&&p.email.toLowerCase()===email.toLowerCase())){authErr='An account with that email already exists.';render();return;}
    const pid='P'+(20000+state.patients.length+Math.floor(Math.random()*900));
    const newP={patientId:pid,name,age:+document.getElementById('f_age').value||null,gender:document.getElementById('f_gender').value,bloodGroup:document.getElementById('f_blood').value,
      email,phone:document.getElementById('f_phone').value,address:document.getElementById('f_address').value,emergencyContact:document.getElementById('f_emergency').value,password:pass,
      condition:'Pending clinical assessment',doctor:'',department:'',admission:'',discharge:'',billing:0,room:null,bed:null,testResult:'Pending',severity:'',
      signupDate:todayStr(),registrationStatus:'Registered - Awaiting Reception',paymentStatus:'Not Generated',receipt:null,notes:[],vitals:[],diagnosisHistory:[],labReports:[],prescriptions:[]};
    state.patients.push(newP); logActivity(`New patient registered: ${name}`); save();
    session={role:'patient',id:pid,lastActivity:Date.now()}; view='patientHome'; render(); return;
  }
  if(authRole==='doctor'){
    if(state.doctors.some(d=>d.email&&d.email.toLowerCase()===email.toLowerCase())){authErr='An account with that email already exists.';render();return;}
    const did='D'+(600+state.doctors.length+Math.floor(Math.random()*900));
    state.doctors.push({doctorId:did,name,department:document.getElementById('f_spec').value,email,password:pass,signupDate:todayStr(),availability:'Available',workingHours:[{start:'09:00',end:'14:00'},{start:'16:00',end:'20:00'}]});
    logActivity(`New doctor registered: ${name}`); save(); session={role:'doctor',id:did,lastActivity:Date.now()}; view='doctorHome'; render(); return;
  }
}

render();
setInterval(()=>{
  const now=liveDateTime();
  document.querySelectorAll('[data-live-clock]').forEach(el=>el.textContent=now);
  const before=state.patients.map(p=>p.billing).join('|');
  const changed=accrueBedCharges();
  document.querySelectorAll('[data-live-billing]').forEach(el=>{const p=state.patients.find(x=>x.patientId===el.dataset.liveBilling);if(p)el.textContent='₹'+currentBillAmount(p).toLocaleString('en-IN',{maximumFractionDigits:2});});
  if(changed && state.patients.map(p=>p.billing).join('|')!==before){
    document.querySelectorAll('[data-live-payment-status]').forEach(el=>{const p=state.patients.find(x=>x.patientId===el.dataset.livePaymentStatus);if(p)el.textContent=p.paymentStatus||'Pending';});
  }
},1000);

</script>
